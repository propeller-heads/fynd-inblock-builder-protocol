[workspace]
members = ["crates/builder-protocol", "crates/builder-types", "crates/fynd-jit-router-interface"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
version = "0.2.2"

[workspace.dependencies]
alloy = { version = "1", features = ["serde", "providers", "transport-http", "rpc-types", "sol-types", "network", "consensus", "eips", "k256"] }
builder-types = { path = "crates/builder-types" }
futures = "0.3"
postcard = { version = "1.1.3", features = ["use-std"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
struct_field_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
